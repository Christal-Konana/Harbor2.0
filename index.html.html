<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; color: #333; }
    .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #111; }
    input, textarea, button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    button { background: #0066cc; color: white; border: none; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    .record { background: white; padding: 1rem; border-radius: 8px; margin-bottom: 0.75rem; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { width: auto; margin: 0; padding: 0.4rem 0.8rem; background: #ff3b30; font-size: 0.85rem; }
  </style>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
  <div class="card">
    <h1>Offline Storage</h1>
    <form id="dataForm">
      <input type="text" id="title" placeholder="Title" required />
      <textarea id="content" placeholder="Details..." rows="3" required></textarea>
      <button type="submit">Save to Phone</button>
    </form>
  </div>

  <h2>Saved Records</h2>
  <div id="recordsList"></div>

  <script src="app.js"></script>
</body>
</html>
